name: Website

# https://aabhimittal.github.io/reverse-engineer/
#   /        Astro landing page (site/), with real rex output captured at build time
#   /demo/   the lab bench generated by scripts/build-demo.py
#   /docs/   the mdBook handbook (docs/)
# Pull requests build and check the whole site; only main deploys it.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "scripts/build-demo.py", "crates/**", "labs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "scripts/build-demo.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: cargo build -p rex-cli --features multiarch
      - run: cargo install mdbook --version 0.5.4 --locked
      - name: Capture real rex output for the demo and the landing page
        run: python3 scripts/build-demo.py --out site/public/demo/index.html --site-data site/src/data/rex.json
      - name: Build the site
        working-directory: site
        run: npm ci && npm run build
      - run: mdbook build docs -d "$PWD/site/dist/docs"
      - name: Every internal link resolves
        run: |
          python3 - <<'PY'
          import html.parser, os, sys, urllib.parse
          root, base = "site/dist", "/reverse-engineer/"
          class P(html.parser.HTMLParser):
              def __init__(s): super().__init__(); s.links = []
              def handle_starttag(s, t, a):
                  for k, v in a:
                      if k in ("href", "src") and v: s.links.append(v)
          bad = []
          for d, _, fs in os.walk(root):
              for f in fs:
                  if not f.endswith(".html"): continue
                  page = os.path.join(d, f); p = P(); p.feed(open(page, encoding="utf-8").read())
                  for l in p.links:
                      u = urllib.parse.urlparse(l)
                      if u.scheme or l.startswith(("#", "mailto:", "data:")): continue
                      path = urllib.parse.unquote(u.path)
                      if path.startswith(base): target = os.path.join(root, path[len(base):])
                      elif path.startswith("/"): bad.append(f"{page}: {l} (outside {base})"); continue
                      else: target = os.path.join(d, path)
                      if os.path.isdir(target): target = os.path.join(target, "index.html")
                      if not os.path.exists(target): bad.append(f"{page}: {l}")
          print("\n".join(bad) or "all internal links resolve"); sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
