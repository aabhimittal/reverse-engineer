name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: report every failing test binary in one run, not just the first.
      - run: cargo test --workspace --no-fail-fast
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Installer behaves (checksum verified, tampering refused)
        run: scripts/test-install.sh
      - name: Committed labs match their generators
        run: |
          python3 labs/wasm/make_wasm.py "$RUNNER_TEMP/sample.wasm"
          cmp "$RUNNER_TEMP/sample.wasm" labs/wasm/sample.wasm
          python3 labs/electron/make_asar.py "$RUNNER_TEMP/app.asar"
          cmp "$RUNNER_TEMP/app.asar" labs/electron/app.asar
  features:
    name: optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rex-binary --features yara,multiarch
      - run: cargo test -p rex-engine --features multiarch
      - run: cargo build -p rex-cli --no-default-features
  demo:
    # Regenerates the demo page from real rex runs; build-demo.py fails if any sample goes blank.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rex-cli --features multiarch
      - run: python3 scripts/build-demo.py --out "$RUNNER_TEMP/demo/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: ${{ runner.temp }}/demo/index.html
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build docs
      - name: CLI reference is up to date
        run: |
          scripts/gen-cli-docs.sh
          git diff --exit-code docs/src/reference/cli.md
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  self-scan:
    name: dogfood (SARIF to code scanning)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p rex-cli -- analyze . -f sarif -o rex.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push'
        with:
          sarif_file: rex.sarif
