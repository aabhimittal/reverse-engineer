name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Go tests build Go binaries on the fly; every job that runs them installs Go, so never skip them here.
  REX_REQUIRE_GO: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # macOS runners do not ship Go.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # --no-fail-fast: report every failing test binary in one run, not just the first.
      - run: cargo test --workspace --no-fail-fast
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Installer behaves (checksum verified, tampering refused)
        run: scripts/test-install.sh
      - name: Committed labs match their generators
        run: |
          python3 labs/wasm/make_wasm.py "$RUNNER_TEMP/sample.wasm"
          cmp "$RUNNER_TEMP/sample.wasm" labs/wasm/sample.wasm
          python3 labs/electron/make_asar.py "$RUNNER_TEMP/app.asar"
          cmp "$RUNNER_TEMP/app.asar" labs/electron/app.asar
  features:
    name: optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rex-binary --features yara,multiarch
      - run: cargo test -p rex-engine --features multiarch
      - run: cargo build -p rex-cli --no-default-features
  ghidra:
    name: ghidra bridge (real Ghidra)
    runs-on: ubuntu-latest
    env:
      GHIDRA_TAG: Ghidra_12.1.4_build
      REX_REQUIRE_GHIDRA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        id: ghidra-cache
        with:
          path: ${{ runner.temp }}/ghidra
          key: ghidra-${{ env.GHIDRA_TAG }}
      - name: Download the pinned Ghidra release (checked against GitHub's sha256 digest)
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(gh api "repos/NationalSecurityAgency/ghidra/releases/tags/$GHIDRA_TAG" \
            --jq '.assets[] | select(.name | endswith(".zip")) | "\(.name) \(.digest)"' | head -1)
          name=${asset% *}; digest=${asset#* }
          test "${digest%%:*}" = sha256
          gh release download "$GHIDRA_TAG" -R NationalSecurityAgency/ghidra -p "$name" -D "$RUNNER_TEMP"
          echo "${digest#sha256:}  $RUNNER_TEMP/$name" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$name" -d "$RUNNER_TEMP/ghidra"
      - name: Point rex at Ghidra
        run: echo "GHIDRA_INSTALL_DIR=$(ls -d "$RUNNER_TEMP"/ghidra/ghidra_*)" >> "$GITHUB_ENV"
      - run: cargo test -p rex-cli --test ghidra -- --nocapture
  demo:
    # Regenerates the demo page from real rex runs; build-demo.py fails if any sample goes blank.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rex-cli --features multiarch
      - run: python3 scripts/build-demo.py --out "$RUNNER_TEMP/demo/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: ${{ runner.temp }}/demo/index.html
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build docs
      - name: CLI reference is up to date
        run: |
          scripts/gen-cli-docs.sh
          git diff --exit-code docs/src/reference/cli.md
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  self-scan:
    name: dogfood (SARIF to code scanning)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p rex-cli -- analyze . -f sarif -o rex.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push'
        with:
          sarif_file: rex.sarif
