name: Release

# Tag `vX.Y.Z` to publish. Run it by hand (Actions > Release > Run workflow) to rehearse:
# every target is built, packaged, checksummed and installed through install.sh, but nothing is
# published and no attestation is made.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-rehearsal' }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cross compiler
        if: matrix.cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # Ubuntu's gcc turns on _FORTIFY_SOURCE, which emits glibc-only symbols (__fprintf_chk,
          # __snprintf_chk) that the musl target cannot link. Found by the first rehearsal.
          echo "CFLAGS_aarch64_unknown_linux_musl=-U_FORTIFY_SOURCE" >> "$GITHUB_ENV"
      - run: cargo build --release -p rex-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="rex-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rex.exe" "$name"/
            7z a "$name.zip" "$name" && echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/rex" "$name"/
            tar czf "$name.tar.gz" "$name" && echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  package:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && ls -l && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Archives are named the way install.sh and cargo-binstall expect
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            test -f "dist/rex-${VERSION}-${t}.tar.gz" || { echo "missing rex-${VERSION}-${t}.tar.gz"; exit 1; }
          done
          test -f "dist/rex-${VERSION}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  smoke:
    name: install smoke test (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install through install.sh from the built release assets
        run: |
          REX_VERSION="$VERSION" REX_BASE_URL="file://$PWD/dist" REX_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The aarch64 binary runs (under qemu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user
          mkdir arm && tar xzf "dist/rex-${VERSION}-aarch64-unknown-linux-musl.tar.gz" -C arm
          qemu-aarch64 "arm/rex-${VERSION}-aarch64-unknown-linux-musl/rex" --version
          qemu-aarch64 "arm/rex-${VERSION}-aarch64-unknown-linux-musl/rex" analyze labs/wasm/sample.wasm
      - name: The installed binary works
        run: |
          rex --version
          rex doctor
          rex analyze labs/wasm/sample.wasm
          rex analyze labs/electron/app.asar --fail-on high || test $? -eq 3
          rex setup --dry-run

  publish:
    name: publish
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
