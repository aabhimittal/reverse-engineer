<title>rex Lab Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a bench. Sample rail on the left, one sample's evidence on the right; findings first, then tables, then code. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #f5f8f9;
  --ink: #14202b;
  --muted: #566774;
  --line: #d3dde3;
  --accent: #0a6c80;
  --accent-soft: #dcf0f3;
  --on-accent: #ffffff;
  --sev-critical: #a4161a;
  --sev-high: #c2310f;
  --sev-medium: #9a6700;
  --sev-low: #1f62a8;
  --sev-info: #566774;
  --ok: #237a3b;
  --code-bg: #f1f5f7;
  --addr: #7b8c98;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218;
    --surface: #131c24;
    --surface-2: #19242d;
    --ink: #e4ebef;
    --muted: #92a3af;
    --line: #26343f;
    --accent: #54c7d8;
    --accent-soft: #123740;
    --on-accent: #06242a;
    --sev-critical: #ff7b7f;
    --sev-high: #ff8a63;
    --sev-medium: #e8b23c;
    --sev-low: #6db3f5;
    --sev-info: #92a3af;
    --ok: #5fd07f;
    --code-bg: #0f171e;
    --addr: #6b7f8c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218;
  --surface: #131c24;
  --surface-2: #19242d;
  --ink: #e4ebef;
  --muted: #92a3af;
  --line: #26343f;
  --accent: #54c7d8;
  --accent-soft: #123740;
  --on-accent: #06242a;
  --sev-critical: #ff7b7f;
  --sev-high: #ff8a63;
  --sev-medium: #e8b23c;
  --sev-low: #6db3f5;
  --sev-info: #92a3af;
  --ok: #5fd07f;
  --code-bg: #0f171e;
  --addr: #6b7f8c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-body);
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
code, pre, .mono { font-family: var(--font-mono); }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.mast h1 { font-size: 1.6rem; }
.mast h1 b { color: var(--accent); font-weight: 600; }
.ver { font: 500 0.78rem var(--font-mono); color: var(--muted); }
.note {
  flex-basis: 100%; margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 70ch;
}

/* Bench grid */
.bench { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); gap: 18px; align-items: start; }
.rail { display: grid; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.rail h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 0 4px 6px; }
.pick {
  display: grid; gap: 1px; text-align: left; background: transparent; border: 1px solid transparent;
  border-radius: 6px; padding: 8px 10px; min-width: 0;
}
.pick:hover { background: var(--surface-2); }
.pick[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent); }
.pick .t { font-weight: 500; overflow-wrap: anywhere; }
.pick .k { font: 400 0.72rem var(--font-mono); color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--c); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.head { padding: 18px 20px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.head h2 { font-size: 1.35rem; }
.head p { margin: 0; color: var(--muted); max-width: 68ch; }
.kindchip { font: 500 0.72rem var(--font-mono); color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; white-space: nowrap; }

.cmd {
  display: flex; align-items: stretch; background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 6px; min-width: 0;
}
.cmd code { flex: 1; min-width: 0; padding: 8px 12px; font-size: 0.82rem; overflow-x: auto; white-space: nowrap; }
.cmd code::before { content: "$ "; color: var(--accent); }
.cmd button {
  border: 0; border-left: 1px solid var(--line); background: var(--surface-2); padding: 0 14px;
  font-size: 0.8rem; border-radius: 0 6px 6px 0;
}
.cmd button:hover { background: var(--accent-soft); }

.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 0.76rem var(--font-mono); color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.gate { font: 500 0.8rem var(--font-mono); }
.gate.fail { color: var(--sev-high); }
.gate.pass { color: var(--ok); }

.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; margin-bottom: -1px;
  font-family: var(--font-display); font-weight: 500; font-size: 0.98rem; color: var(--muted); white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.body { padding: 16px 20px 22px; display: grid; gap: 14px; min-width: 0; }

/* Severity */
.sevbar { display: flex; flex-wrap: wrap; gap: 6px; }
.sevbtn {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface-2); font: 500 0.78rem var(--font-mono);
}
.sevbtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.sevbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sevbtn[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg); }
.sevbtn[disabled] { opacity: 0.4; cursor: default; }
[data-sev="critical"] { --c: var(--sev-critical); }
[data-sev="high"] { --c: var(--sev-high); }
[data-sev="medium"] { --c: var(--sev-medium); }
[data-sev="low"] { --c: var(--sev-low); }
[data-sev="info"] { --c: var(--sev-info); }

.finding { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.finding summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px;
  padding: 10px 12px; align-items: baseline;
}
.finding summary::-webkit-details-marker { display: none; }
.finding[open] summary { border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: 6px 6px 0 0; }
.pill {
  font: 500 0.68rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--c);
  border: 1px solid var(--c); border-radius: 3px; padding: 1px 6px; min-width: 4.6rem; text-align: center;
}
.finding .ft { font-weight: 500; overflow-wrap: anywhere; }
.finding .fid { grid-column: 2; font: 400 0.72rem var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.fbody { padding: 12px 14px 14px; display: grid; gap: 10px; }
.fbody p { margin: 0; max-width: 70ch; }
.ev { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.ev li { font: 400 0.8rem var(--font-mono); background: var(--code-bg); padding: 3px 8px; border-radius: 3px; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 400 0.72rem var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 14px; }

/* Details */
.sect { border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.sect > summary { cursor: pointer; padding: 9px 12px; font-family: var(--font-display); font-weight: 500; display: flex; justify-content: space-between; gap: 12px; }
.sect > summary .n { font: 400 0.72rem var(--font-mono); color: var(--muted); align-self: center; }
.sect[open] > summary { border-bottom: 1px solid var(--line); background: var(--surface-2); }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font: 400 0.8rem var(--font-mono); }
th, td { text-align: left; padding: 5px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
td.wrap { white-space: normal; min-width: 14rem; }
th { font: 500 0.7rem var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }
dl.kv { display: grid; grid-template-columns: minmax(8rem, max-content) minmax(0, 1fr); margin: 0; font-size: 0.85rem; }
dl.kv dt { color: var(--muted); padding: 5px 12px; border-bottom: 1px solid var(--line); }
dl.kv dd { margin: 0; padding: 5px 12px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.8rem; overflow-wrap: anywhere; }
.trunc { padding: 6px 12px; color: var(--muted); font-size: 0.75rem; }

/* Code */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.segbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 4px 10px; font: 400 0.8rem var(--font-mono); }
.segbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
pre.code {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
  font-size: 0.78rem; line-height: 1.6; overflow-x: auto; max-width: 100%; tab-size: 4;
}
.a { color: var(--addr); } .c { color: var(--muted); font-style: italic; } .m { color: var(--accent); font-weight: 500; }
.graph {
  border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); overflow: auto; max-height: 38rem;
}
.graph svg { display: block; margin: 0 auto; }
.graph .blk { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.graph .blk.entry { stroke: var(--accent); stroke-width: 1.5; }
.graph .ad { fill: var(--accent); font: 500 10.5px var(--font-mono); }
.graph .ln { fill: var(--ink); font: 400 10.5px var(--font-mono); }
.graph .ed { fill: none; stroke-width: 1.4; }
.graph .ed.true { stroke: var(--ok); } .graph .ed.false { stroke: var(--sev-high); }
.graph .ed.jump { stroke: var(--accent); } .graph .ed.fall { stroke: var(--muted); }
.graph .ed.back { stroke-dasharray: 4 3; }
.graph .lab { font: 500 10px var(--font-mono); }
.graph .lab.true { fill: var(--ok); } .graph .lab.false { fill: var(--sev-high); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 0.72rem var(--font-mono); color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--k); margin-right: 6px; vertical-align: 3px; }
.legend .t { --k: var(--ok); } .legend .f { --k: var(--sev-high); } .legend .j { --k: var(--accent); } .legend .n { --k: var(--muted); }
.legend .b::before { border-top-style: dashed; }

@media (max-width: 820px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .rail h2 { display: none; }
  .pick { min-width: 11rem; border-color: var(--line); background: var(--surface); }
  .head, .body { padding-inline: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="wrap">
  <header class="mast">
    <h1><b>rex</b> lab bench</h1>
    <span class="ver" id="ver"></span>
    <p class="note">Everything below was captured from real <code>rex</code> runs on files in the repository (<code>scripts/build-demo.py</code> regenerates this page). Nothing executes in your browser, and rex never executes the samples either.</p>
  </header>
  <div class="bench">
    <nav class="rail" id="rail" aria-label="Samples"><h2>Samples</h2></nav>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
</div>

<script>
const D = /*__REX_DATA__*/null;
const SEV = ["critical", "high", "medium", "low", "info"];
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const sevCounts = (s) => Object.fromEntries(SEV.map((v) => [v, s.findings.filter((f) => f.severity === v).length]));

let state = { id: null, tab: "findings", filter: null, view: 0 };
try { const h = location.hash.slice(1); if (D.samples.some((s) => s.id === h)) state.id = h; } catch (e) {}
if (!state.id) state.id = D.samples[0].id;

function renderRail() {
  const rail = $("#rail");
  rail.querySelectorAll(".pick").forEach((n) => n.remove());
  for (const s of D.samples) {
    const c = sevCounts(s);
    const dots = el("span", { class: "dots", "aria-hidden": "true" },
      SEV.filter((v) => c[v]).map((v) => el("i", { "data-sev": v, title: `${c[v]} ${v}` })));
    rail.append(el("button", {
      class: "pick", "aria-current": String(s.id === state.id),
      onclick: () => select(s.id),
    }, el("span", { class: "t" }, s.title), el("span", { class: "k" }, s.kind, s.findings.length ? dots : null)));
  }
}

function select(id) {
  state = { id, tab: "findings", filter: null, view: 0 };
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  const s = D.samples.find((x) => x.id === id);
  if (!s.findings.length) state.tab = "code";
  renderRail();
  renderPanel();
}

function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = o), 1400); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

function renderPanel() {
  const s = D.samples.find((x) => x.id === state.id);
  const panel = $("#panel");
  panel.replaceChildren();
  const c = sevCounts(s);
  const gateIdx = SEV.indexOf(s.gate);
  const worst = SEV.findIndex((v) => c[v] > 0);
  const fails = s.findings.length > 0 && worst !== -1 && worst <= gateIdx;

  const head = el("div", { class: "head" },
    el("h2", {}, s.title, el("span", { class: "kindchip" }, s.kind)),
    el("p", {}, s.blurb),
    el("div", { class: "cmd" },
      el("code", {}, s.command),
      el("button", { type: "button", onclick: (e) => copyText(s.command, e.currentTarget) }, "Copy")));
  if (s.artifact) {
    const a = s.artifact;
    head.append(el("div", { class: "meta" },
      el("span", {}, "size ", el("b", {}, a.size.toLocaleString() + " B")),
      el("span", {}, "sha256 ", el("b", {}, a.sha256.slice(0, 16) + "…")),
      el("span", {}, "analysed in ", el("b", {}, s.duration_ms + " ms")),
      s.findings.length
        ? el("span", { class: "gate " + (fails ? "fail" : "pass") },
            fails ? `exit 3 · findings at or above ${s.gate}` : `exit 0 · nothing at or above ${s.gate}`)
        : null));
  }
  panel.append(head);

  const tabs = [];
  if (s.findings.length) tabs.push(["findings", `Findings (${s.findings.length})`]);
  if (s.sections.length) tabs.push(["details", "Details"]);
  if (s.views.length) tabs.push(["code", s.id === "agents" ? "Output" : "Code & graphs"]);
  if (!tabs.some((t) => t[0] === state.tab)) state.tab = tabs[0][0];
  const bar = el("div", { class: "tabs", role: "tablist" }, tabs.map(([k, label]) =>
    el("button", {
      class: "tab", role: "tab", "aria-selected": String(k === state.tab),
      onclick: () => { state.tab = k; renderPanel(); },
    }, label)));
  panel.append(bar);

  const body = el("div", { class: "body", role: "tabpanel" });
  if (state.tab === "findings") renderFindings(s, body, c);
  else if (state.tab === "details") renderDetails(s, body);
  else renderCode(s, body);
  panel.append(body);
}

function renderFindings(s, body, c) {
  body.append(el("div", { class: "sevbar", role: "group", "aria-label": "Filter by severity" },
    SEV.map((v) => el("button", {
      class: "sevbtn", "data-sev": v, disabled: !c[v], "aria-pressed": String(state.filter === v),
      onclick: () => { state.filter = state.filter === v ? null : v; renderPanel(); },
    }, el("i"), `${c[v]} ${v}`))));
  const list = s.findings.filter((f) => !state.filter || f.severity === state.filter);
  list.forEach((f, i) => {
    const d = el("details", { class: "finding", "data-sev": f.severity, open: i === 0 && !state.filter });
    d.append(el("summary", {},
      el("span", { class: "pill" }, f.severity),
      el("span", { class: "ft" }, f.title),
      el("span", { class: "fid" }, f.id + (f.category ? " · " + f.category : ""))));
    const fb = el("div", { class: "fbody" });
    if (f.description) fb.append(el("p", {}, f.description));
    if (f.evidence && f.evidence.length) fb.append(el("ul", { class: "ev" }, f.evidence.map((e) => el("li", {}, e))));
    if (f.attack && f.attack.length) fb.append(el("div", { class: "tags" }, f.attack.map((t) => el("span", { class: "tag" }, "ATT&CK " + t))));
    d.append(fb);
    body.append(d);
  });
  if (!list.length) body.append(el("div", { class: "empty" }, "No findings at this severity."));
}

const NUMERIC = /^(0x[0-9a-f]+|-?\d[\d,.]*)$/i;
function renderTable(b) {
  const t = el("table", {});
  t.append(el("thead", {}, el("tr", {}, b.columns.map((h) => el("th", {}, h)))));
  const tb = el("tbody", {});
  for (const row of b.rows) {
    tb.append(el("tr", {}, row.map((cell) => {
      const long = String(cell).length > 60;
      return el("td", { class: (long ? "wrap " : "") + (NUMERIC.test(String(cell)) ? "num" : "") }, cell);
    })));
  }
  t.append(tb);
  const wrap = el("div", { class: "scroll" }, t);
  const out = el("div", {}, wrap);
  if (b.truncated) out.append(el("div", { class: "trunc" }, `${b.truncated} more rows omitted by rex (raise --max-rows)`));
  return out;
}
function renderBody(sec) {
  const b = sec.body;
  if (b.type === "table") return b.rows.length ? renderTable(b) : el("div", { class: "trunc" }, "(none)");
  if (b.type === "key_value") {
    return el("dl", { class: "kv" }, b.pairs.map(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]));
  }
  return el("pre", { class: "code" }, b.text || b.code || JSON.stringify(b, null, 2));
}
function renderDetails(s, body) {
  const first = new Set(s.sections.filter((x) => /overview|checksec|capabilities|ipc|import_xrefs|endpoints|carve|regions/.test(x.id)).map((x) => x.id));
  s.sections.forEach((sec) => {
    const n = sec.body.type === "table" ? `${sec.body.rows.length} rows` : sec.body.type === "key_value" ? `${sec.body.pairs.length} fields` : "";
    const d = el("details", { class: "sect", open: first.has(sec.id) },
      el("summary", {}, sec.title, el("span", { class: "n" }, n)), renderBody(sec));
    body.append(d);
  });
}

function colorize(text) {
  const frag = document.createDocumentFragment();
  for (const line of text.split("\n")) {
    const row = el("span", {});
    let m;
    if ((m = line.match(/^(\s+)([0-9a-f]{4,16})(\s+)((?:[0-9a-f]{2} ?)+)(\s+)(\S+)(.*?)(\s*;.*)?$/i))) {
      row.append(m[1], el("span", { class: "a" }, m[2]), m[3], el("span", { class: "a" }, m[4]), m[5], el("span", { class: "m" }, m[6]), m[7]);
      if (m[8]) row.append(el("span", { class: "c" }, m[8]));
    } else if ((m = line.match(/^([0-9a-f]{8})(\s+)(\s*)(\S+)(.*?)(\s*;;.*)?$/i))) {
      row.append(el("span", { class: "a" }, m[1]), m[2], m[3], el("span", { class: "m" }, m[4]), m[5]);
      if (m[6]) row.append(el("span", { class: "c" }, m[6]));
    } else if (/^\s*;/.test(line) || /^loc_/.test(line)) {
      row.append(el("span", { class: line.startsWith("loc_") ? "m" : "c" }, line));
    } else row.append(line);
    row.append("\n");
    frag.append(row);
  }
  return frag;
}

function renderCode(s, body) {
  if (state.view >= s.views.length) state.view = 0;
  if (s.views.length > 1) {
    body.append(el("div", { class: "seg", role: "group", "aria-label": "View" }, s.views.map((v, i) =>
      el("button", { class: "segbtn", "aria-pressed": String(i === state.view), onclick: () => { state.view = i; renderPanel(); } }, v.label))));
  }
  const v = s.views[state.view];
  body.append(el("div", { class: "cmd" }, el("code", {}, v.command), el("button", { type: "button", onclick: (e) => copyText(v.command, e.currentTarget) }, "Copy")));
  if (v.type === "cfg") {
    body.append(el("div", { class: "legend" },
      el("span", { class: "t" }, "taken"), el("span", { class: "f" }, "not taken"), el("span", { class: "j" }, "jump"),
      el("span", { class: "n" }, "fall-through"), el("span", { class: "j b" }, "back edge (loop)")));
    body.append(el("div", { class: "graph" }, drawCfg(v)));
  } else {
    const pre = el("pre", { class: "code" });
    pre.append(colorize(v.text));
    body.append(pre);
  }
}

/* CFG layout: longest-path layering over the DAG left after removing DFS back edges, one barycentre pass per layer. */
function drawCfg(g) {
  const NS = "http://www.w3.org/2000/svg";
  const S = (tag, attrs = {}, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  const CH = 6.3, LH = 14, PAD = 8, MAXL = 8;
  const nodes = new Map(g.nodes.map((n, i) => {
    const lines = n.lines.length > MAXL ? [...n.lines.slice(0, MAXL), "…"] : n.lines;
    const w = Math.max(n.addr.length, ...lines.map((l) => l.length)) * CH + PAD * 2;
    return [n.id, { ...n, lines, w, h: (lines.length + 1) * LH + PAD * 2 - 4, i, level: 0, succ: [], pred: [] }];
  }));
  const root = g.nodes[0].id;
  const back = new Set(), state = new Map(), order = [];
  const adj = new Map([...nodes.keys()].map((k) => [k, []]));
  g.edges.forEach((e, i) => nodes.has(e.from) && nodes.has(e.to) && adj.get(e.from).push([e.to, i]));
  const dfs = (u) => {
    state.set(u, 1);
    for (const [v, i] of adj.get(u)) {
      if (state.get(v) === 1) back.add(i);
      else if (!state.has(v)) dfs(v);
    }
    state.set(u, 2); order.push(u);
  };
  dfs(root);
  for (const k of nodes.keys()) if (!state.has(k)) dfs(k);
  const fwd = g.edges.map((e, i) => [e, i]).filter(([e, i]) => !back.has(i) && nodes.has(e.from) && nodes.has(e.to));
  for (const u of [...order].reverse()) {
    for (const [e] of fwd) if (e.from === u) nodes.get(e.to).level = Math.max(nodes.get(e.to).level, nodes.get(u).level + 1);
  }
  for (const [e] of fwd) { nodes.get(e.from).succ.push(e.to); nodes.get(e.to).pred.push(e.from); }
  const levels = [];
  for (const n of nodes.values()) (levels[n.level] ||= []).push(n);
  const GAPX = 34, GAPY = 46, MARGIN = 54;
  const rowW = levels.map((r) => r.reduce((a, n) => a + n.w, 0) + GAPX * (r.length - 1));
  const W = Math.max(...rowW) + MARGIN * 2;
  levels.forEach((row, li) => {
    if (li > 0) row.sort((a, b) => bary(a) - bary(b) || a.i - b.i);
    else row.sort((a, b) => a.i - b.i);
    let x = (W - rowW[li]) / 2;
    for (const n of row) { n.x = x; x += n.w + GAPX; }
  });
  function bary(n) { const p = n.pred.filter((q) => nodes.get(q).x != null); return p.length ? p.reduce((a, q) => a + nodes.get(q).x + nodes.get(q).w / 2, 0) / p.length : n.i * 1000; }
  let y = 18;
  const ys = levels.map((row) => { const top = y; y += Math.max(...row.map((n) => n.h)) + GAPY; return top; });
  levels.forEach((row, li) => row.forEach((n) => (n.y = ys[li])));
  const H = y - GAPY + 24;

  const svg = S("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Control-flow graph" });
  const defs = S("defs");
  for (const k of ["true", "false", "jump", "fall"]) {
    const m = S("marker", { id: "ar-" + k, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto" });
    m.append(S("path", { d: "M0 0L8 4L0 8z", class: "ar " + k, fill: `var(--${{ true: "ok", false: "sev-high", jump: "accent", fall: "muted" }[k]})` }));
    defs.append(m);
  }
  svg.append(defs);
  let backLane = 0;
  g.edges.forEach((e, i) => {
    const a = nodes.get(e.from), b = nodes.get(e.to);
    if (!a || !b) return;
    let d, lx, ly;
    if (back.has(i)) {
      const lane = 10 + (backLane++ % 4) * 8;
      const sx = a.x, sy = a.y + a.h / 2, tx = b.x, ty = b.y + b.h / 2;
      const left = Math.min(sx, tx) - lane - 6;
      d = `M${sx} ${sy} C${left} ${sy} ${left} ${ty} ${tx} ${ty}`;
    } else {
      const sx = a.x + a.w / 2, sy = a.y + a.h, tx = b.x + b.w / 2, ty = b.y;
      const dy = Math.max(18, (ty - sy) / 2);
      // Fan out true/false edges from the left/right quarter of the source block.
      const off = e.kind === "true" ? a.w * 0.25 : e.kind === "false" ? -a.w * 0.25 : 0;
      const sx2 = sx + (a.succ.length > 1 ? off : 0);
      d = `M${sx2} ${sy} C${sx2} ${sy + dy} ${tx} ${ty - dy} ${tx} ${ty - 1}`;
      lx = sx2 + (off >= 0 ? 4 : -12); ly = sy + 12;
    }
    svg.append(S("path", { d, class: `ed ${e.kind}${back.has(i) ? " back" : ""}`, "marker-end": `url(#ar-${e.kind})` }));
    if (lx != null && (e.kind === "true" || e.kind === "false")) svg.append(S("text", { x: lx, y: ly, class: "lab " + e.kind }, e.kind === "true" ? "T" : "F"));
  });
  for (const n of nodes.values()) {
    svg.append(S("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 4, class: "blk" + (n.id === root ? " entry" : "") }));
    svg.append(S("text", { x: n.x + PAD, y: n.y + PAD + 8, class: "ad" }, n.addr));
    n.lines.forEach((l, k) => svg.append(S("text", { x: n.x + PAD, y: n.y + PAD + 8 + (k + 1) * LH, class: "ln" }, l)));
  }
  return svg;
}

$("#ver").textContent = D.rex_version;
renderRail();
renderPanel();
</script>
